version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: replaylab-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: api-replaylab
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - replaylab-network

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: replaylab-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/api-replaylab
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - replaylab-network

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: replaylab-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - replaylab-network

volumes:
  mongodb_data:
    driver: local

networks:
  replaylab-network:
    driver: bridge
